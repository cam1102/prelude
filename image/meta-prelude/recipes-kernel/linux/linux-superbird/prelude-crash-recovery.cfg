# A kernel oops mid-session used to leave the device wedged on the last video
# frame until someone pulled power. Turn every oops and lockup into a panic,
# reboot 3 s later, and keep the backtrace in ramoops so the next boot can
# archive it.
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=3

CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=y
CONFIG_HARDLOCKUP_DETECTOR=y
CONFIG_BOOTPARAM_HARDLOCKUP_PANIC=y

# The journal syncs every 10 s and loses the backtrace of a crash that kills
# the system. The ramoops region lives in the device tree, so the driver must
# be built in to claim it before anything can crash.
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_DEFAULT_KMSG_BYTES=32768
